# Demo: हनुमान और भीम का मिलन (Mahabharata, Vana Parva) — 7 shots, curtain intro/outro.
# Render:  python .claude/skills/mythic-25d/mythic.py make mythic_projects/demo_hanuman_bhima --quality preview
title: "हनुमान और भीम"
format: "16:9"
fps: 30
grade: auto
voice:
  engine: edge
  narrator: hi-IN-MadhurNeural
  rate: "-6%"
  pitch: "-2Hz"
  cast:
    bhima:   {voice: hi-IN-MadhurNeural, rate: "-2%", pitch: "-12Hz"}
    hanuman: {voice: hi-IN-MadhurNeural, rate: "-12%", pitch: "-6Hz"}
music: {mood: devotional, volume_db: -17}
subtitles: {style: karaoke}
highlight: [हनुमान, भीम, गंधमादन, कपिध्वज, अर्जुन]
intro: {curtain: true, title: "हनुमान और भीम", subtitle: "महाभारत की एक कथा", label: "महाभारत ↗ वन पर्व"}
outro: {curtain: true, text: "॥ जय बजरंगबली ॥", subtitle: "अगली कथा में — कपिध्वज का रहस्य"}

shots:
  - id: s1_dhyan
    env: forest_banana_dawn
    camera: {move: crane_down}          # reference opening: start in the canopy/sky, descend onto the puppet
    narration: "द्वापर युग की बात है। गंधमादन पर्वत के कदली वन में, पवनपुत्र हनुमान राम-नाम का ध्यान कर रहे थे।"
    cast:
      - {who: hanuman, x: 0.5, pose: meditate}
    fx: [dust]

  - id: s2_bhima_aata_hai
    env: forest_banana_day
    transition: wipe                    # big dark banana leaves sweep past the lens
    camera: {move: follow, on: bhima, frame: full}   # track Bhima as he walks in
    narration: "उसी मार्ग से महाबली भीम, द्रौपदी के लिए सौगंधिक पुष्प लेने जा रहे थे।"
    lines:
      - {who: bhima, text: "हे वृद्ध वानर! मेरे मार्ग से अपनी पूँछ हटाओ।"}
    cast:
      - {who: hanuman, x: 0.64, pose: seated, face: left}
      - {who: bhima, x: -0.2, face: right, actions: [{do: walk, to: 0.3, at: 0.3, dur: 3.4}, {do: point, at: 4.6, dur: 3.0}]}

  - id: s3_vinti
    env: forest_banana_day
    camera: {move: push_to, on: hanuman, frame: close}
    lines:
      - {who: hanuman, text: "पुत्र, मैं बहुत वृद्ध हूँ। तुम स्वयं ही मेरी पूँछ हटा दो।"}
    cast:
      - {who: hanuman, x: 0.64, pose: seated, face: left, actions: [{do: bless, at: 2.6, dur: 2.0}]}
      - {who: bhima, x: 0.3, face: right, actions: [{do: laugh, at: 0.2, dur: 1.4}]}

  - id: s4_shakti
    env: forest_banana_day
    camera: {move: truck_left, from: 1.12, to: 1.2}
    narration: "भीम ने पूरी शक्ति लगा दी — पर वह पूँछ तिल भर भी नहीं हिली!"
    cast:
      - {who: hanuman, x: 0.64, pose: seated, face: left}
      - {who: bhima, x: 0.36, face: right, actions: [{do: angry, at: 0.3, dur: 1.4}, {do: strike, at: 1.8, dur: 1.0},
                                                    {do: shake, at: 3.0, dur: 2.5, amount: 1.4}, {do: sad, at: 5.6, dur: 3, keep: true}]}
    fx: ["shake@2.4", dust]

  - id: s5_virat
    env: forest_banana_dusk
    grade: swarna
    transition: flash
    camera: {move: reveal, on: hanuman, frame: medium}
    narration: "तब हनुमान ने अपना विराट रूप प्रकट किया। भीम पहचान गए — ये तो उनके बड़े भाई, स्वयं हनुमान हैं!"
    shloka:
      source: "हनुमत् स्तुति"
      lines: ["बुद्धिर्बलं यशो धैर्यं निर्भयत्वमरोगता ।", "अजाड्यं वाक्पटुत्वं च हनुमत्स्मरणाद्भवेत् ॥"]
      gloss: [[बुद्धिर्बलं, "बुद्धि और बल"], [धैर्यं, धैर्य], [निर्भयत्वमरोगता, "निडरता, आरोग्य"], [वाक्पटुत्वं, "वाक्‌-कौशल"]]
      meaning: "हनुमान का स्मरण करने से बुद्धि, बल, यश, धैर्य, निर्भयता और आरोग्य मिलता है।"
      at: 0.6
      dur: 7.5
    cast:
      - {who: hanuman, x: 0.62, face: left, actions: [{do: grow, at: 0.8, dur: 2.4, to: 1.22}, {do: raise_both, at: 1.2, dur: 3.5}]}
      - {who: bhima, x: 0.27, face: right, actions: [{do: namaste, at: 3.2, dur: 8, keep: true}]}
    fx: ["divine_burst@0.9", rays, petals]

  - id: s6_vachan
    env: shadow_screen_night
    transition: dip
    camera: {move: float}
    fx: ["dim@0.4"]                     # house lights down: the listeners become silhouettes
    narration: "हनुमान ने वचन दिया — धर्मयुद्ध में वे अर्जुन के रथ की ध्वजा पर विराजमान रहेंगे।"
    cast:
      - {who: hanuman, x: 0.3, y: 0.74, depth: 0.62, shadow_puppet: true, strings: false,
         actions: [{do: fly, to: 0.54, at: 0.6, dur: 4.0, height: 4, arc: true}]}
      - {who: bhima, x: 0.78, pose: seated, face: left}
      - {who: vyasa, x: 0.12, pose: seated, face: right}

  - id: s7_kapidhwaj
    env: kurukshetra_dusk
    music: {mood: epic_battle}
    transition: wipe
    camera: {move: establish, on: arjuna, frame: full}
    narration: "और इसी कारण कुरुक्षेत्र में अर्जुन का रथ, कपिध्वज कहलाया।"
    props:
      - {name: chariot, x: 0.45, layer: over, s: 2.0, emblem: hanuman, flag: mustard}
    cast:
      - {who: white_horse, id: horse1, x: 0.79, face: right, scale: 0.78, depth: 0.96, actions: [{do: rear, at: 1.0, dur: 1.4}]}
      - {who: white_horse, id: horse2, x: 0.86, face: right, scale: 0.78, actions: [{do: graze, at: 2.5, dur: 2}]}
      - {who: krishna, x: 0.6, y: 0.705, face: right, actions: [{do: bless, at: 1.5, dur: 3}]}
      - {who: arjuna, x: 0.47, y: 0.705, face: right, actions: [{do: raise, at: 2.0, dur: 2.5}]}
    fx: [dust, "flash@3.6"]
    sfx:
      - {name: conch, at: 0.3, vol: -6}
      - {name: war_drums, at: 1.0, vol: -14, dur: 5}
